<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="robots" content="noindex">
    <title>Redefinir Senha - João V. Cantuária</title>
    <link rel="stylesheet" href="styles.css">
    <link rel="stylesheet" href="auth-styles.css">
    <link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
</head>
<body>
    <!-- Header Simplificado -->
    <header id="header" class="header-simple">
        <nav class="navbar">
            <div class="container">
                <div class="nav-wrapper">
                    <div class="logo">
                        <a href="index.html">
                            <img src="logo-placeholder.png" alt="João V. Cantuária" class="logo-img">
                            <span class="logo-text">João V. Cantuária</span>
                        </a>
                    </div>
                    <a href="login.html" class="btn-back">
                        <i class="fas fa-arrow-left"></i> Voltar ao Login
                    </a>
                </div>
            </div>
        </nav>
    </header>

    <section class="auth-section">
        <div class="auth-container">
            <div class="auth-wrapper">
                <div class="auth-left">
                    <div class="auth-left-content">
                        <h2>Nova senha</h2>
                        <p>Escolha uma nova senha para acessar sua área exclusiva.</p>
                    </div>
                </div>

                <div class="auth-right">
                    <div class="auth-form-container">
                        <h1 class="auth-title">Redefinir Senha</h1>
                        <p class="auth-subtitle" id="resetSubtitle">Validando o link do e-mail...</p>

                        <div id="authMessage" class="auth-message"></div>

                        <form id="resetForm" class="auth-form" style="display:none;">
                            <div class="form-group">
                                <label for="newPassword">
                                    <i class="fas fa-lock"></i> Nova senha
                                </label>
                                <div class="password-input-wrapper">
                                    <input type="password" id="newPassword" required minlength="6"
                                           placeholder="Mínimo 6 caracteres" autocomplete="new-password">
                                    <button type="button" class="toggle-password" data-target="newPassword">
                                        <i class="fas fa-eye"></i>
                                    </button>
                                </div>
                            </div>

                            <div class="form-group">
                                <label for="confirmPassword">
                                    <i class="fas fa-lock"></i> Confirmar senha
                                </label>
                                <div class="password-input-wrapper">
                                    <input type="password" id="confirmPassword" required minlength="6"
                                           placeholder="Repita a senha" autocomplete="new-password">
                                    <button type="button" class="toggle-password" data-target="confirmPassword">
                                        <i class="fas fa-eye"></i>
                                    </button>
                                </div>
                            </div>

                            <button type="submit" class="btn btn-primary btn-block btn-auth">
                                <i class="fas fa-check"></i> Salvar nova senha
                            </button>
                        </form>

                        <p class="auth-switch" id="resetInvalid" style="display:none;">
                            Link inválido ou expirado.
                            <a href="login.html">Peça um novo em "Esqueceu a senha?"</a>
                        </p>
                    </div>
                </div>
            </div>
        </div>
    </section>

    <!-- Supabase SDK -->
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <script>
        const supabaseSDK = window.supabase;
        var supabase = supabaseSDK.createClient(
            'https://gzetvnqnqmjrkcfsjxyk.supabase.co',
            'sb_publishable_i5bIlH9xOl7Oeh3MEVnuXg_F7Zp3aZ5'
        );

        const form = document.getElementById('resetForm');
        const subtitle = document.getElementById('resetSubtitle');

        function showMessage(message, type = 'error') {
            const el = document.getElementById('authMessage');
            el.textContent = message;
            el.className = `auth-message ${type} show`;
        }

        function showForm() {
            subtitle.textContent = 'Digite e confirme sua nova senha.';
            form.style.display = '';
        }

        // O link do e-mail traz o token na URL; o SDK cria a sessao de recuperacao
        let ready = false;
        supabase.auth.onAuthStateChange((event, session) => {
            if (session && (event === 'PASSWORD_RECOVERY' || event === 'SIGNED_IN' || event === 'INITIAL_SESSION')) {
                ready = true;
                showForm();
            }
        });

        setTimeout(() => {
            if (ready) return;
            subtitle.textContent = '';
            document.getElementById('resetInvalid').style.display = '';
        }, 2500);

        // Mostrar/ocultar senha
        document.querySelectorAll('.toggle-password').forEach(button => {
            button.addEventListener('click', () => {
                const input = document.getElementById(button.getAttribute('data-target'));
                const icon = button.querySelector('i');
                const show = input.type === 'password';
                input.type = show ? 'text' : 'password';
                icon.classList.toggle('fa-eye', !show);
                icon.classList.toggle('fa-eye-slash', show);
            });
        });

        form.addEventListener('submit', async (e) => {
            e.preventDefault();
            const senha = document.getElementById('newPassword').value;
            const conf = document.getElementById('confirmPassword').value;

            if (senha.length < 6) { showMessage('A senha deve ter no mínimo 6 caracteres.'); return; }
            if (senha !== conf) { showMessage('As senhas não coincidem.'); return; }

            const btn = form.querySelector('button[type="submit"]');
            btn.disabled = true;
            btn.innerHTML = '<i class="fas fa-spinner fa-spin"></i> Salvando...';

            const { error } = await supabase.auth.updateUser({ password: senha });
            if (error) {
                showMessage(error.message.includes('different from the old')
                    ? 'A nova senha deve ser diferente da anterior.'
                    : 'Não foi possível salvar. Peça um novo link e tente de novo.');
                btn.disabled = false;
                btn.innerHTML = '<i class="fas fa-check"></i> Salvar nova senha';
                return;
            }

            showMessage('Senha alterada! Redirecionando para sua área...', 'success');
            setTimeout(() => { window.location.href = 'area-cliente.html'; }, 1500);
        });
    </script>
</body>
</html>
