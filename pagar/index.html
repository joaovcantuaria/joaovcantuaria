<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
    <meta name="robots" content="noindex, nofollow">
    <title>Pagamento · João Vitor Cantuária</title>
    <meta name="description" content="Pagamento seguro com cartão de crédito.">
    <meta name="theme-color" content="#0B0907">
    <link rel="icon" href="/favicon.png">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Archivo:wght@400;500;700;900&family=Playfair+Display:ital,wght@1,600&display=swap" rel="stylesheet">

    <style>
        :root {
            --bg: #0B0907;
            --surface: #16120E;
            --surface-2: #1E1813;
            --line: rgba(255, 237, 214, 0.1);
            --cream: #F7EFE4;
            --muted: #A99C8D;
            --orange: #FF7A1A;
            --orange-2: #FFA445;
            --orange-deep: #E8540C;
            --green: #3DDC84;
            --red: #FF6B5E;
            --font: 'Archivo', system-ui, -apple-system, 'Segoe UI', sans-serif;
            --serif: 'Playfair Display', Georgia, serif;
        }
        *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
        html { -webkit-text-size-adjust: 100%; }
        body {
            min-height: 100vh;
            display: grid;
            place-items: center;
            padding: 24px 16px;
            background: radial-gradient(120% 60% at 50% -10%, rgba(255,122,26,.18), transparent 60%), var(--bg);
            color: var(--cream);
            font-family: var(--font);
            line-height: 1.5;
            -webkit-font-smoothing: antialiased;
        }
        [hidden] { display: none !important; }
        .card {
            width: min(440px, 100%);
            padding: 30px 24px;
            border-radius: 24px;
            background: linear-gradient(180deg, var(--surface-2), var(--surface));
            border: 1px solid var(--line);
            text-align: center;
            box-shadow: 0 30px 80px rgba(0,0,0,.5);
        }
        .brand { font-size: 12px; font-weight: 700; letter-spacing: .24em; text-transform: uppercase; color: var(--orange); }
        .ola { margin-top: 16px; font-size: 18px; color: #E6DACB; }
        .ola em { font-family: var(--serif); color: var(--orange-2); }
        .desc { margin-top: 10px; font-size: 20px; font-weight: 700; line-height: 1.3; }
        .valor { margin-top: 18px; font-size: 48px; font-weight: 900; letter-spacing: -.03em; line-height: 1; color: var(--orange); font-variant-numeric: tabular-nums; }
        .parcelas { margin-top: 8px; color: var(--muted); font-size: 15px; }
        .parcelas b { color: var(--cream); }
        .btn {
            display: flex; align-items: center; justify-content: center; gap: 10px;
            width: 100%; min-height: 60px; margin-top: 24px; padding: 0 20px;
            border: 0; border-radius: 16px; cursor: pointer;
            background: linear-gradient(180deg, var(--orange-2), var(--orange) 55%, var(--orange-deep));
            color: #1A0E04; font: inherit; font-weight: 900; font-size: 16px; letter-spacing: .04em; text-transform: uppercase; text-decoration: none;
            box-shadow: 0 12px 36px rgba(255,122,26,.4), inset 0 1px 0 rgba(255,255,255,.35);
            transition: transform .12s ease;
        }
        .btn:active { transform: scale(.98); }
        .btn svg { width: 22px; height: 22px; flex: none; }
        .seguro { display: flex; align-items: center; justify-content: center; gap: 8px; margin-top: 14px; font-size: 13px; color: var(--muted); }
        .seguro svg { width: 16px; height: 16px; color: var(--green); flex: none; }
        .expira { margin-top: 10px; font-size: 12px; color: var(--muted); }
        .estado .icone { width: 64px; height: 64px; margin: 6px auto 0; border-radius: 50%; display: grid; place-content: center; font-size: 30px; }
        .estado.ok .icone { background: rgba(61,220,132,.14); color: var(--green); }
        .estado.alerta .icone { background: rgba(255,164,69,.14); color: var(--orange-2); }
        .estado.erro .icone { background: rgba(255,107,94,.14); color: var(--red); }
        .estado h1 { margin-top: 16px; font-size: 22px; font-weight: 900; }
        .estado p { margin-top: 8px; color: #DCCFBF; }
        .wpp { display: inline-block; margin-top: 18px; color: var(--orange-2); font-weight: 700; }
        .loading { display: flex; justify-content: center; gap: 8px; padding: 30px 0; }
        .loading i { width: 10px; height: 10px; border-radius: 50%; background: var(--orange); animation: p 1s infinite ease-in-out; }
        .loading i:nth-child(2) { animation-delay: .15s; } .loading i:nth-child(3) { animation-delay: .3s; }
        @keyframes p { 0%, 100% { opacity: .25; transform: scale(.8); } 50% { opacity: 1; transform: scale(1); } }
        @media (prefers-reduced-motion: reduce) { * { animation: none !important; transition: none !important; } }
    </style>
</head>
<body>
    <main class="card">
        <p class="brand">João Vitor Cantuária</p>

        <div class="loading" id="carregando" aria-label="Carregando"><i></i><i></i><i></i></div>

        <!-- Link aberto -->
        <div id="aberto" hidden>
            <p class="ola" id="ola"></p>
            <p class="desc" id="desc"></p>
            <p class="valor" id="valor"></p>
            <p class="parcelas" id="parcelas"></p>
            <a class="btn" id="pagar" href="#">
                <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" aria-hidden="true"><rect x="2.5" y="5" width="19" height="14" rx="2.5"/><path d="M2.5 10h19M6.5 15h4"/></svg>
                Pagar com cartão
            </a>
            <p class="seguro">
                <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect x="4" y="10" width="16" height="11" rx="2"/><path d="M8 10V7a4 4 0 0 1 8 0v3"/></svg>
                Pagamento seguro processado pelo Mercado Pago
            </p>
            <p class="expira" id="expira" hidden></p>
        </div>

        <!-- Outros estados -->
        <div class="estado" id="estado" hidden>
            <div class="icone" id="estadoIcone"></div>
            <h1 id="estadoTitulo"></h1>
            <p id="estadoTexto"></p>
            <a class="wpp" id="estadoWpp" href="https://wa.me/5538999209694" target="_blank" rel="noopener">Falar com o João no WhatsApp</a>
        </div>
    </main>

    <script>
        const SUPABASE_URL = 'https://gzetvnqnqmjrkcfsjxyk.supabase.co';
        const SUPABASE_KEY = 'sb_publishable_i5bIlH9xOl7Oeh3MEVnuXg_F7Zp3aZ5';
        const $ = id => document.getElementById(id);
        const brl = v => Number(v).toLocaleString('pt-BR', { style: 'currency', currency: 'BRL' });

        const params = new URLSearchParams(location.search);
        const codigo = (params.get('c') || '').trim();
        const retorno = params.get('retorno');

        function estado(tipo, icone, titulo, textoEstado) {
            $('carregando').hidden = true;
            $('aberto').hidden = true;
            $('estado').hidden = false;
            $('estado').className = 'estado ' + tipo;
            $('estadoIcone').textContent = icone;
            $('estadoTitulo').textContent = titulo;
            $('estadoTexto').textContent = textoEstado;
        }

        async function carregar() {
            if (!/^[A-Za-z0-9]{6,12}$/.test(codigo)) {
                return estado('erro', '!', 'Link inválido', 'Confira se o link foi copiado completo.');
            }
            let link = null;
            try {
                const res = await fetch(`${SUPABASE_URL}/rest/v1/rpc/get_pg_link`, {
                    method: 'POST',
                    headers: { 'apikey': SUPABASE_KEY, 'Authorization': `Bearer ${SUPABASE_KEY}`, 'Content-Type': 'application/json' },
                    body: JSON.stringify({ p_codigo: codigo }),
                });
                link = res.ok ? await res.json() : null;
            } catch { /* sem conexao */ }

            if (!link) return estado('erro', '!', 'Link não encontrado', 'Este link de pagamento não existe ou foi digitado errado.');

            if (link.status === 'pago' || retorno === 'aprovado') {
                return estado('ok', '✓', 'Pagamento confirmado!', `Obrigado${link.cliente_nome ? ', ' + link.cliente_nome : ''}! Recebemos o pagamento de ${brl(link.valor)}.`);
            }
            if (retorno === 'pendente') {
                return estado('alerta', '…', 'Pagamento em análise', 'O Mercado Pago está processando o seu pagamento. Você recebe a confirmação por e-mail.');
            }
            if (link.status === 'cancelado') return estado('erro', '×', 'Link cancelado', 'Este link de pagamento foi cancelado. Fale comigo para receber um novo.');
            if (link.status === 'expirado' || !link.url) return estado('alerta', '!', 'Link expirado', 'O prazo deste link acabou. Fale comigo para receber um novo.');

            $('carregando').hidden = true;
            $('aberto').hidden = false;
            $('ola').innerHTML = '';
            $('ola').append(link.cliente_nome ? `Olá, ${link.cliente_nome}! ` : 'Olá! ');
            const em = document.createElement('em');
            em.textContent = 'Seu pagamento está pronto.';
            $('ola').append(em);
            $('desc').textContent = link.descricao;
            $('valor').textContent = brl(link.valor);
            $('parcelas').innerHTML = link.max_parcelas > 1
                ? `No cartão de crédito em até <b>${link.max_parcelas}x</b>`
                : 'À vista no cartão de crédito';
            $('pagar').href = link.url;
            if (link.expira_em) {
                $('expira').hidden = false;
                $('expira').textContent = 'Link válido até ' + new Date(link.expira_em).toLocaleDateString('pt-BR');
            }
            if (retorno === 'falhou') {
                $('ola').textContent = 'O pagamento não foi concluído. Você pode tentar de novo.';
            }
        }
        carregar();
    </script>
</body>
</html>
